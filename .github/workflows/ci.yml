name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

env:
  # Placeholder Supabase values so packages that eagerly validate env
  # (packages/config) can boot for lint/typecheck/unit tests that don't
  # need a real project. The RLS integration test job below points at a
  # real local Postgres service instead.
  SUPABASE_URL: https://placeholder.supabase.co
  SUPABASE_ANON_KEY: placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: family_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply database migrations (test database)
        run: pnpm --filter @family-app/database migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/family_app_test

      - name: Unit + integration tests (includes security isolation suites)
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/family_app_test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/family_app_test

      - name: Build
        run: pnpm build

      - name: Security check — forbidden hardcoded role comparisons
        run: |
          if grep -rnE "role\s*===\s*['\"]" apps packages --include="*.ts" --include="*.tsx" \
              --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.next \
              | grep -v -E "packages/(policy-engine|business-rules)/"; then
            echo "::error::Found a hardcoded role comparison outside packages/policy-engine. All authorization must go through the Family Policy Engine (§25)."
            exit 1
          fi
          echo "OK — no hardcoded role checks found outside the Policy Engine."
