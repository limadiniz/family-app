name: Deploy — Production

# Production Supabase migrations + apps/api (Fly.io) on every push to `main`.
#
# apps/web is deliberately NOT deployed from here — same reasoning as
# deploy-staging.yml: Vercel's own GitHub integration handles it. See
# DEPLOYMENT.md "CD — production".
#
# This pipeline follows DEPLOYMENT.md's documented target for production:
# validate → backup → migration → deploy → health check → smoke test.
#
# GATING: create a `production` GitHub Environment (Settings → Environments)
# with required reviewers turned on. Every job below sets
# `environment: production`, so the whole pipeline pauses for manual
# approval before touching the real database — this is the actual
# enforcement point for "no unreviewed production deploy", not a suggestion.
#
# Required repo secrets — see DEPLOYMENT.md "Secrets by host" for exactly
# where each one is generated:
#   SUPABASE_ACCESS_TOKEN           — personal/org access token (shared with staging)
#   SUPABASE_STAGING_PROJECT_REF    — staging ref, used only to prove that production is isolated
#   SUPABASE_PRODUCTION_PROJECT_REF — production project's ref
#   SUPABASE_PRODUCTION_DB_URL      — production pooler connection string (used ONLY for
#                                      the pre-deploy pg_dump backup step below; rotate
#                                      this password periodically, same as the
#                                      docs/checklists/infra-checklist.md pendency)
#   FLY_API_TOKEN_PRODUCTION        — `fly tokens create deploy -a family-app-api-production`
#   GOOGLE_MAPS_API_KEY_PRODUCTION  — Google Cloud API key restricted to Routes API

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false # never cancel mid-migration or mid-backup

jobs:
  isolation-check:
    name: Refuse a shared staging/production database
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Assert distinct Supabase projects
        env:
          STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          PRODUCTION_PROJECT_REF: ${{ secrets.SUPABASE_PRODUCTION_PROJECT_REF }}
        run: |
          if [ -z "$STAGING_PROJECT_REF" ] || [ -z "$PRODUCTION_PROJECT_REF" ]; then
            echo "::error::Both Supabase project refs are required to verify environment isolation."
            exit 1
          fi
          if [ "$STAGING_PROJECT_REF" = "$PRODUCTION_PROJECT_REF" ]; then
            echo "::error::Staging and production resolve to the same Supabase project. Deployment refused."
            exit 1
          fi
          echo "Supabase staging/production isolation verified."

  backup:
    name: Pre-deploy backup (production database)
    needs: isolation-check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: pg_dump — schema + data
        run: |
          # Ubuntu's own `postgresql-client` package lags behind Supabase's
          # server version (currently Postgres 17.x) — pg_dump refuses to
          # dump from a server newer than itself, so we pull the matching
          # client straight from the official PGDG apt repo instead of the
          # Ubuntu-shipped one. Bump PG_CLIENT_MAJOR if Supabase moves to a
          # newer major version later.
          PG_CLIENT_MAJOR=17
          sudo apt-get install -y -qq curl ca-certificates gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-${PG_CLIENT_MAJOR}"
          export PATH="/usr/lib/postgresql/${PG_CLIENT_MAJOR}/bin:$PATH"
          pg_dump --version
          mkdir -p backups
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          pg_dump "$DATABASE_URL" --schema-only > "backups/${stamp}_production_schema.sql"
          pg_dump "$DATABASE_URL" --data-only --column-inserts > "backups/${stamp}_production_data.sql"
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_PRODUCTION_DB_URL }}

      - name: Upload backup as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-backup-${{ github.sha }}
          path: backups/
          retention-days: 90

  migrate:
    name: Apply migrations (production Supabase project)
    needs: backup
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project + push migrations
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PRODUCTION_PROJECT_REF }}"
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  deploy-api:
    name: Deploy apps/api (Fly.io)
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Configure Google Routes API key
        run: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "::warning::GOOGLE_MAPS_API_KEY_PRODUCTION não foi configurada; o cálculo usará apenas o link do Google Maps."
          else
            flyctl secrets set \
              GOOGLE_MAPS_API_KEY="$GOOGLE_MAPS_API_KEY" \
              --app family-app-api-production
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PRODUCTION }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY_PRODUCTION }}

      - name: fly deploy
        run: flyctl deploy --config fly.production.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PRODUCTION }}

  smoke-test:
    name: Smoke test — GET /health
    needs: deploy-api
    runs-on: ubuntu-latest
    steps:
      - name: Poll apps/api health endpoint
        run: |
          url="https://family-app-api-production.fly.dev/health"
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url" || echo "000")
            if [ "$code" = "200" ]; then
              echo "apps/api is healthy ($url)"
              exit 0
            fi
            echo "attempt $i/10: got HTTP $code from $url, retrying in 6s..."
            sleep 6
          done
          echo "::error::apps/api did not report healthy at $url after deploy — consider rollback (redeploy the previous Fly release: 'fly releases -a family-app-api-production' then 'fly deploy --image <previous-image>'), see DEPLOYMENT.md."
          exit 1
