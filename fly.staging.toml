# ============================================================================
# fly.toml — apps/api on Fly.io, STAGING environment.
#
# One-time setup (see docs/checklists/infra-checklist.md "Fly.io"):
#   fly auth login
#   fly apps create family-app-api-staging
#   fly secrets set -a family-app-api-staging \
#     SUPABASE_URL=... SUPABASE_ANON_KEY=... SUPABASE_SERVICE_ROLE_KEY=... \
#     CORS_ALLOWED_ORIGINS=https://staging.app.<domain>
#   (values come from the STAGING Supabase project — never reuse family-app-dev's)
#
# Manual deploy (from repo root):
#   fly deploy --config fly.staging.toml
#
# Automated deploy: .github/workflows/deploy-staging.yml runs this on every
# push to `develop` once FLY_API_TOKEN_STAGING is set as a repo secret.
# ============================================================================

app = "family-app-api-staging"  # must be globally unique on Fly — rename if taken.
primary_region = "gru"          # São Paulo — same region as the Supabase project (sa-east-1).

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  APP_ENV = "staging"
  API_PORT = "4000"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
