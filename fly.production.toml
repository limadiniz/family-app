# ============================================================================
# fly.toml — apps/api on Fly.io, PRODUCTION environment.
#
# One-time setup (see docs/checklists/infra-checklist.md "Fly.io"):
#   fly auth login
#   fly apps create family-app-api-production
#   fly secrets set -a family-app-api-production \
#     SUPABASE_URL=... SUPABASE_ANON_KEY=... SUPABASE_SERVICE_ROLE_KEY=... \
#     CORS_ALLOWED_ORIGINS=https://app.<domain>
#   (values come from the PRODUCTION Supabase project — never reuse dev/staging's)
#
# Manual deploy (from repo root):
#   fly deploy --config fly.production.toml
#
# Automated deploy: .github/workflows/deploy-production.yml runs this on every
# push to `main` once FLY_API_TOKEN_PRODUCTION is set as a repo secret. That
# workflow also requires the GitHub "production" Environment's manual
# reviewers to approve (see DEPLOYMENT.md "CD — production").
# ============================================================================

app = "family-app-api-production"  # must be globally unique on Fly — rename if taken.
primary_region = "gru"             # São Paulo — same region as the Supabase project (sa-east-1).

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  APP_ENV = "production"
  API_PORT = "4000"
  WEB_APP_URL = "https://www.zelii.com.br"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "off"   # never scale to zero in production
  auto_start_machines = true
  min_machines_running = 2     # basic redundancy — one machine can restart/deploy without downtime
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
